name: Student Attendance CI

on:
  push:
    branches:
      - main

jobs:
  run-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance tests
        run: pytest pytesty.py -v

      - name: Workflow status
        run: echo "All tests passed — CI/CD successful!"
